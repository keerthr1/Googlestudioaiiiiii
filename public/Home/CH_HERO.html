<body>
<div class="stage" id="stage">
  <canvas id="trail"></canvas>
  <div id="char"></div>
</div>

<script>
const stage = document.getElementById("stage");
const canvas = document.getElementById("trail");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = stage.clientWidth;
  canvas.height = stage.clientHeight;
}
resize();
window.addEventListener("resize", resize);

let points = [];
let mouse = null;

stage.addEventListener("mousemove", e => {
  const r = stage.getBoundingClientRect();
  mouse = { x: e.clientX - r.left, y: e.clientY - r.top };
});
stage.addEventListener("mouseleave", () => { mouse = null; });

function tick(){
  requestAnimationFrame(tick);

  if(mouse){
    points.push({ x: mouse.x, y: mouse.y, life: 1 });
  }

  // fade the canvas by erasing alpha, not painting over it -> keeps character visible beneath
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.globalCompositeOperation = "source-over";

  // decay + draw
  points.forEach(p => p.life -= 0.02);
  points = points.filter(p => p.life > 0);

  for(let i=1;i<points.length;i++){
    const a = points[i-1], b = points[i];
    const alpha = Math.max(b.life,0) * 0.9;
    if(alpha <= 0) continue;
    const grad = ctx.createLinearGradient(a.x,a.y,b.x,b.y);
    grad.addColorStop(0, `rgba(32,54,184,${alpha*0.15})`);
    grad.addColorStop(1, `rgba(32,54,184,${alpha*0.9})`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1 + alpha*2.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();
  }
}
tick();
</script>
</body></html>
