<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500">
  <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
    <!-- Micro fine grain noise -->
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" result="microNoise" />
    <feColorMatrix type="matrix" values="
      0.33 0.33 0.33 0 0.02
      0.33 0.33 0.33 0 0.02
      0.33 0.33 0.33 0 0.02
      0 0 0 0.15 0" result="microGrain" />
    
    <!-- Organic paper fiber shading -->
    <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="2" stitchTiles="stitch" result="fiberNoise" />
    <feColorMatrix type="matrix" values="
      0.33 0.33 0.33 0 0
      0.33 0.33 0.33 0 0
      0.33 0.33 0.33 0 0
      0 0 0 0.05 0" result="fiberGrain" />

    <feBlend mode="multiply" in="microGrain" in2="fiberGrain" />
  </filter>
  <rect width="100%" height="100%" filter="url(#paper-texture)" />
</svg>
